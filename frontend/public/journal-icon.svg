<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#58CC02" />
  
  <!-- Journal icon -->
  <g transform="translate(25, 25) scale(0.5)">
    <rect x="20" y="10" width="60" height="80" rx="5" ry="5" fill="white" />
    <line x1="35" y1="30" x2="65" y2="30" stroke="#1CB0F6" stroke-width="5" stroke-linecap="round" />
    <line x1="35" y1="45" x2="65" y2="45" stroke="#1CB0F6" stroke-width="5" stroke-linecap="round" />
    <line x1="35" y1="60" x2="55" y2="60" stroke="#1CB0F6" stroke-width="5" stroke-linecap="round" />
    
    <!-- Pen -->
    <g transform="translate(60, 60) rotate(-45)">
      <rect x="-5" y="-25" width="10" height="35" rx="2" ry="2" fill="#FFC800" />
      <polygon points="0,-30 -5,-25 5,-25" fill="#FF4B4B" />
    </g>
  </g>
</svg> 