# Redis configuration for the Journal App
# Basic server settings
port 6379
bind 0.0.0.0
protected-mode no

# Security settings
# Disable commands that could be dangerous
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command KEYS ""

# Performance settings
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging settings
loglevel notice
logfile ""

# Client settings
timeout 0
tcp-keepalive 300

# Connection settings
tcp-backlog 511 