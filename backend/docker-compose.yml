services:
  db:
    image: postgres:13-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    # Add health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      
  vectordb:
    build:
      context: .
      dockerfile: vectordb.Dockerfile
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - vectordb
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PRODUCTION_ENV=true
      - VECTORDB_URL=http://vectordb:6333

volumes:
  pgdata:
  redisdata:
  qdrant_data: